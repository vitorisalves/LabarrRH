<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Fundo circular branco -->
  <circle cx="200" cy="200" r="195" fill="#FFFFFF" stroke="#000000" stroke-width="8" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="#000000" stroke-width="6" />
  
  <!-- Texto curvado superior: CHOCOLATE DE -->
  <!-- Texto curvado inferior: ORIGEM -->
  <path id="textCircleTop" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
  <path id="textCircleBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />
  
  <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="34" letter-spacing="9" fill="#000000">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      CHOCOLATE DE
    </textPath>
  </text>
  
  <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="34" letter-spacing="12" fill="#000000">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ORIGEM
    </textPath>
  </text>
  
  <!-- Símbolo geométrico central da Labarr -->
  <g transform="translate(200,200)" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Losango central com nó entrelaçado -->
    <polygon points="0,-48 48,0 0,48 -48,0" />
    <!-- Pequeno losango superior -->
    <polygon points="0,-72 14,-58 0,-44 -14,-58" />
    <!-- Pequeno losango inferior -->
    <polygon points="0,44 14,58 0,72 -14,58" />
  </g>
</svg>
